name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode and Metal toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal

      - uses: dtolnay/rust-toolchain@4dfd137a5aecc12897f37a01818006f58cf58347 # 1.98.0

      # Tag runs can restore main's cache, which also holds cargo-deny and cargo-audit in ~/.cargo/bin.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: daedalus-macos
          save-if: false

      - name: Tag matches the crate version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -I -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="daedalus"))')
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Supply chain
        run: |
          cargo install --locked cargo-deny cargo-audit
          cargo deny check
          cargo audit

      - run: cargo test --workspace --locked
      - run: ./scripts/bundle.sh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Daedalus-*-arm64.zip dist/Daedalus-*-arm64.zip.sha256 \
            --title "Daedalus ${GITHUB_REF_NAME#v}" --notes "Install: brew install --cask tlsc-eng/daedalus/daedalus"
