[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
gpui = "=0.2.2"
alacritty_terminal = "0.26"
portable-pty = "0.9"
ropey = "1.6"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
streaming-iterator = "0.1"
ignore = "0.4"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-channel = "2.5"
libproc = "0.14"
anyhow = "1"
libc = "0.2"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSAccessibility", "NSApplication", "NSDockTile", "NSResponder"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDictionary", "NSValue", "NSError", "NSObject", "NSBundle"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationSound", "UNNotificationResponse", "UNNotification", "UNNotificationTrigger"] }
block2 = "0.6"
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "WKNavigationDelegate", "WKNavigationAction", "WKNavigation", "WKUIDelegate", "WKFrameInfo", "WKWindowFeatures"] }
raw-window-handle = "0.6"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "time", "sync", "net"] }
schemars = "1"
sha2 = "0.11"
futures = "0.3"
bollard = { version = "=0.21.1", default-features = false, features = ["pipe"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

athena-proto = { path = "crates/athena-proto" }
athena-term = { path = "crates/athena-term" }
athena-editor = { path = "crates/athena-editor" }
athena-workspace = { path = "crates/athena-workspace" }
athena-ui = { path = "crates/athena-ui" }
athena-containers = { path = "crates/athena-containers" }
athena-playwright = { path = "crates/athena-playwright" }
athena-preview = { path = "crates/athena-preview" }
athena-lsp = { path = "crates/athena-lsp" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
